<ion-content>

  <ion-item lines="full">
    <ion-label class="ion-text-center">
      <h2 style="margin-top: 30px;">Favourites</h2>
    </ion-label>
  </ion-item>

  <ion-grid>
    <ion-row>
      <!-- ✅ favProducts() - signal call with () -->
      @for (item of favProducts(); track item) {
        <ion-col size="12" size-md="4" size-lg="3">
          <ion-card (click)="openProduct(item)">

            <ion-icon 
              [name]="item.isFavorite ? 'heart' : 'heart-outline'" 
              color="danger"
              (click)="toggleFav(item); $event.stopPropagation()">
            </ion-icon>

            <div class="img-box">
              <img [src]="item.img" alt="{{item.name}}" />
            </div>

            <ion-card-content>
              <h2>{{item.name}}</h2>
              <p>{{item.size}}</p>
              <div class="price-row">
                <span class="price">₹{{item.price}}</span>
                <ion-icon name="chevron-forward-outline" class="forward"></ion-icon>
              </div>
            </ion-card-content>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- ✅ favCount() signal -->
  @if (favCount() > 0) {
    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="8" offset-md="2">
          <div class="btn-wrapper">
            <ion-button expand="block" class="green-btn" fill="clear" (click)="addAllToCart()">
              <span style="color: white;">Add All to Cart</span>
            </ion-button>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  }

  <!-- ✅ Empty state -->
  @if (favCount() === 0) {
    <div class="empty-msg ion-text-center">
      <p>No favourites yet ❤️</p>
    </div>
  }

</ion-content>

<app-footer></app-footer>
