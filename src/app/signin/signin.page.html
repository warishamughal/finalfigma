<ion-content [fullscreen]="true" class="login-bg" scroll-y="false">
  <ion-grid>
    <ion-row class="ion-justify-content-center">
      
      <!-- ✅ Content ko 12 col on mobile, 7 col on md -->
      <ion-col size="12" size-md="7">

        <!-- 🔹 Image Section -->
    <ion-row>
  <ion-col size="12" class="top-img ion-text-center">
    <div class="img-wrapper">
      <img src="../../assets/img/grocery.png" alt="groceries" />
    </div>
  </ion-col>
</ion-row>


        <!-- 🔹 Text + Inputs + Buttons -->
        <div class="content-wrap">
          <h2 class="title">Get your groceries<br>with nectar</h2>

          <!-- 🔹 Input with left flag -->
          <div class="input-row">
            <img src="../../assets/img/Bangladesh Large Flag.jpeg" class="flag" alt="flag" />
            <ion-input placeholder="+880" type="tel"></ion-input>
          </div>

          <!-- 🔹 Small text -->
          <p class="or-text">Or connect with social media</p>

          <!-- 🔹 Buttons -->
          <ion-button expand="block" class="google-btn">
            Continue with Google
          </ion-button>

          <ion-button expand="block" class="fb-btn">
            Continue with Facebook
          </ion-button>
        </div>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
